<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>برنامه غذایی کاروان‌های ارزان قیمت</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #f6f9f0;
            --bg-gradient-end: #e9f3e6;
            --card-bg: rgba(255, 255, 255, 0.85);
            --table-bg: #fffffff2;
            --text-primary: #1e2f1c;
            --text-secondary: #476b3c;
            --header-bg: #1f4d2e;
            --header-text: #fff7e8;
            --border-color: #c8ddb5;
            --row-hover: #fef9e6;
            --day-cell-bg: #fef3da;
            --day-cell-text: #3b5c2a;
            --price-tag-bg: #f2e8cf;
            --checkbox-border: #2c6e2c;
            --shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
            --icon-color: #e67e22;
            --modal-bg: #ffffff;
            --modal-overlay: rgba(0, 0, 0, 0.6);
        }

        body.dark {
            --bg-gradient-start: #1a2a1a;
            --bg-gradient-end: #0f1f0f;
            --card-bg: rgba(30, 40, 25, 0.9);
            --table-bg: #2a3525;
            --text-primary: #e8f0e0;
            --text-secondary: #b8d9a6;
            --header-bg: #0f3b22;
            --header-text: #fef5e0;
            --border-color: #5a6e4a;
            --row-hover: #3e4d34;
            --day-cell-bg: #4a3e2a;
            --day-cell-text: #f5e6c8;
            --price-tag-bg: #4a553a;
            --checkbox-border: #7cb342;
            --shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
            --icon-color: #f39c12;
            --modal-bg: #2a3525;
            --modal-overlay: rgba(0, 0, 0, 0.8);
        }

        body {
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            font-family: 'Vazirmatn', 'Segoe UI', system-ui, sans-serif;
            padding: 2rem 1.5rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(2px);
            border-radius: 3rem;
            box-shadow: var(--shadow);
            padding: 1.8rem 1.2rem 1.5rem 1.2rem;
        }

        .main-title {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .main-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2c6e2c;
            display: inline-block;
            padding: 0.4rem 1.5rem;
        }
        body.dark .main-title h1 {
            color: #7cb342;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .action-btn {
            background: var(--price-tag-bg);
            border: none;
            padding: 0.6rem 1.3rem;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: var(--icon-color);
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 1.5rem;
            background: var(--table-bg);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .meal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 900px;
        }

        .meal-table th {
            background: var(--header-bg);
            color: var(--header-text);
            font-weight: 700;
            padding: 1rem 0.8rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .meal-table td {
            background-color: var(--table-bg);
            padding: 0.9rem 0.7rem;
            vertical-align: top;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .meal-table tr:hover td {
            background-color: var(--row-hover);
        }

        .day-cell {
            font-weight: 800;
            background-color: var(--day-cell-bg);
            color: var(--day-cell-text);
            text-align: center;
            vertical-align: middle;
        }

        .clickable-food {
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 30px;
            background: rgba(230, 126, 34, 0.1);
        }
        .clickable-food:hover {
            background: rgba(230, 126, 34, 0.3);
            transform: scale(1.02);
        }
        .clickable-food i {
            margin-left: 5px;
            color: var(--icon-color);
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .checklist-item input {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: var(--checkbox-border);
        }
        .checked-text {
            text-decoration: line-through;
            opacity: 0.7;
        }
        .reset-day {
            font-size: 0.7rem;
            background: none;
            border: none;
            color: var(--icon-color);
            cursor: pointer;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .custom-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px dashed var(--border-color);
            font-size: 0.9rem;
        }
        .custom-footer p:first-child {
            font-weight: 600;
            color: var(--icon-color);
            margin-bottom: 0.5rem;
        }
        .custom-footer p:last-child {
            font-weight: 500;
            color: var(--text-secondary);
            direction: rtl;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-container {
            background: var(--modal-bg);
            border-radius: 2rem;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            border: 1px solid var(--border-color);
            font-family: 'Vazirmatn', sans-serif;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--icon-color);
            padding-bottom: 0.8rem;
        }
        .modal-header h2 {
            font-size: 1.8rem;
            color: var(--icon-color);
            font-family: 'Vazirmatn', sans-serif;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-family: 'Vazirmatn', sans-serif;
        }
        .modal-body label {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
        }
        .modal-body input {
            width: 100%;
            padding: 12px;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            background: var(--table-bg);
            color: var(--text-primary);
            font-size: 1rem;
            margin: 10px 0;
            font-family: 'Vazirmatn', sans-serif;
        }
        .calc-btn {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
        }
        .result-box {
            margin-top: 20px;
            background: var(--row-hover);
            border-radius: 1rem;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Vazirmatn', sans-serif;
        }
        .result-item {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            font-family: 'Vazirmatn', sans-serif;
        }

        @media print {
            @page {
                size: landscape;
                margin: 0.5cm;
            }
            .action-bar,
            .custom-footer,
            .reset-day,
            .action-btn,
            .modal-overlay {
                display: none !important;
            }
            .checklist-item input {
                display: none !important;
            }
            .clickable-food i {
                display: none !important;
            }
            body, body.dark {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .container {
                background: white !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            .meal-table {
                font-size: 0.7rem !important;
            }
            .meal-table th, .meal-table td {
                border: 1px solid #999 !important;
                padding: 0.4rem 0.3rem !important;
            }
            .meal-table tr {
                page-break-inside: avoid;
            }
        }

        @media (max-width: 760px) {
            body { padding: 1rem; }
            .main-title h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-title">
        <h1>📋 جدول برنامه غذایی کاروان های ارزان قیمت</h1>
    </div>

    <div class="action-bar">
        <button class="action-btn" id="darkModeToggle"><i class="fas fa-moon"></i> حالت شب</button>
        <button class="action-btn" id="printBtn"><i class="fas fa-print"></i> پرینت / PDF</button>
        <button class="action-btn" id="resetAllChecklist"><i class="fas fa-undo-alt"></i> ریست همه تیک ها</button>
    </div>

    <div class="table-wrapper">
        <table class="meal-table" id="mealTable">
            <thead>
                <tr><th>روز</th><th>صبحانه</th><th>ناهار</th><th>دورچین هتل (ناهار)</th><th>شام</th><th>دورچین هتل (شام)</th></tr>
            </thead>
            <tbody id="mealTableBody"></tbody>
        </table>
    </div>

    <div class="custom-footer">
        <p>این برنامه توسط محمد میراحمدیان تهیه شده</p>
        <p>جهت استفاده از این برنامه شادی روح شهداء و امام شهیدان صلوات</p>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2 id="modalFoodName">عدسی</h2>
            <button class="modal-close" id="modalCloseBtn">&times;</button>
        </div>
        <div class="modal-body">
            <label>تعداد نفرات:</label>
            <input type="number" id="modalPersons" min="1" placeholder="مثلا 50">
            <button class="calc-btn" id="modalCalcBtn">محاسبه مواد اولیه</button>
            <div id="modalResult" class="result-box"></div>
        </div>
    </div>
</div>

<script>
    const ingredientsData = {
        "عدسی": { "عدس": 40, "رب گوجه فرنگی": 5, "پیاز": 20, "کره": 5, "دارچین": 0.25, "فلفل سیاه": 0.15, "زردچوبه": 0.25, "نمک": 5, "جوپرک": 10 },
        "املت گوجه فرنگی": { "کره حیوانی": 10, "گوجه فرنگی": 120, "تخم مرغ (عدد)": 1.5, "روغن سرخ کردنی": 10 },
        "سالاد کلم": { "کشمش یا گردو": 10, "کلم بنفش": 10, "کلم سفید": 40, "ذرت شیرین": 15, "هویج": 25 },
        "سالاد شیرازی": { "خیار": 60, "گوجه فرنگی": 50, "پیاز": 40 },
        "ماست و خیار": { "خیار": 40, "ماست": 110, "نعناع خشک": "به مقدار لازم" }
    };

    const clickableFoods = ["عدسی", "املت گوجه فرنگی", "سالاد کلم", "سالاد شیرازی", "ماست و خیار"];

    const mealsData = [
        { day: "اول", breakfast: "پنیر ۳۰ گرمی + تخم مرغ + کره + عسل + مربا + چای + شکر", lunch: "باقلاپلو با گوشت", sideLunch: "ماست و خیار + نوشابه + پرتقال + نصف نان", dinner: "خوراک کوبیده مرغ", sideDinner: "نصف لیموترش + پیاز + نوشابه + نارنگی + سالاد کلم + نصف نان" },
        { day: "دوم", breakfast: "پنیر ۳۰ گرمی + خیار و گوجه + کره + عسل + حلوا شکری + چای + شکر", lunch: "چلوخورشت قورمه سبزی", sideLunch: "پیاز + ماست + نوشابه + پرتقال + نصف نان", dinner: "خوراک جوجه کباب", sideDinner: "نصف لیموترش + دوغ + موز + زیتون + سالاد کلم + نصف نان" },
        { day: "سوم", breakfast: "پنیر ۳۰ گرمی + تخم مرغ + کره + عسل + مربا + چای + شکر", lunch: "زرشک پلو با مرغ", sideLunch: "ماست و خیار + نوشابه + پرتقال + نصف نان", dinner: "خوراک کباب کوبیده", sideDinner: "نصف لیموترش + پیاز + نوشابه + نارنگی + سالاد کلم + نصف نان" },
        { day: "چهارم", breakfast: "پنیر ۳۰ گرمی + خیار و گوجه + کره + عسل + حلوا شکری + چای + شکر", lunch: "چلوخورشت قیمه بادمجان", sideLunch: "پیاز + ماست + نوشابه + پرتقال + نصف نان", dinner: "استیک گریل شده مرغ یا شنسل", sideDinner: "نصف لیمو ترش + دوغ + سیب + زیتون + سالاد کلم + نصف نان" },
        { day: "پنجم", breakfast: "پنیر ۳۰ گرمی + تخم مرغ + کره + عسل + مربا + چای + شکر", lunch: "سبزی پلو با ماهی", sideLunch: "سالاد شیرازی + نوشابه + پرتقال + خرما + نصف لیموترش + نصف نان", dinner: "خوراک کباب کوبیده", sideDinner: "نصف لیموترش + پیاز + نوشابه + نارنگی + سالاد کلم + نصف نان" },
        { day: "ششم", breakfast: "پنیر ۳۰ گرمی + خیار و گوجه + کره + عسل + حلوا شکری + چای + شکر", lunch: "چلوخورشت قورمه سبزی", sideLunch: "پیاز + ماست + نوشابه + پرتقال + نصف نان", dinner: "خوراک جوجه کباب", sideDinner: "نصف لیموترش + دوغ + موز + زیتون + سالاد کلم + نصف نان" }
    ];

    function wrapClickableItems(text) {
        let items = text.split(' + ');
        let wrapped = items.map(item => {
            let trimmed = item.trim();
            let matched = clickableFoods.find(food => trimmed.includes(food));
            if (matched) {
                return `<span class="clickable-food" data-food="${matched}"><i class="fas fa-calculator"></i> ${trimmed}</span>`;
            }
            return trimmed;
        });
        return wrapped.join(' + ');
    }

    let checklistState = JSON.parse(localStorage.getItem('mealChecklist_v1') || '{}');
    function saveState() { localStorage.setItem('mealChecklist_v1', JSON.stringify(checklistState)); }

    function renderTable() {
        const tbody = document.getElementById('mealTableBody');
        tbody.innerHTML = '';
        mealsData.forEach((item, rowIdx) => {
            const tr = document.createElement('tr');
            const tdDay = document.createElement('td');
            tdDay.className = 'day-cell';
            tdDay.innerHTML = `<i class="fas fa-calendar-day"></i> ${item.day}<br><button class="reset-day" data-row="${rowIdx}"><i class="fas fa-trash-alt"></i> ریست روز</button>`;
            tr.appendChild(tdDay);

            tr.appendChild(createChecklistCell(`row_${rowIdx}_breakfast`, wrapClickableItems(item.breakfast)));
            tr.appendChild(createChecklistCell(`row_${rowIdx}_lunch`, item.lunch));
            tr.appendChild(createChecklistCell(`row_${rowIdx}_sideLunch`, wrapClickableItems(item.sideLunch)));
            tr.appendChild(createChecklistCell(`row_${rowIdx}_dinner`, item.dinner));
            tr.appendChild(createChecklistCell(`row_${rowIdx}_sideDinner`, wrapClickableItems(item.sideDinner)));
            tbody.appendChild(tr);
        });
        attachClickEvents();
    }

    function createChecklistCell(id, contentHtml) {
        const td = document.createElement('td');
        const wrapper = document.createElement('div');
        wrapper.className = 'checklist-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = id;
        cb.checked = checklistState[id] || false;
        const labelSpan = document.createElement('span');
        labelSpan.innerHTML = contentHtml;
        labelSpan.style.flex = '1';
        if (cb.checked) labelSpan.classList.add('checked-text');
        cb.addEventListener('change', (e) => {
            checklistState[id] = e.target.checked;
            saveState();
            if(e.target.checked) labelSpan.classList.add('checked-text');
            else labelSpan.classList.remove('checked-text');
        });
        wrapper.appendChild(cb);
        wrapper.appendChild(labelSpan);
        td.appendChild(wrapper);
        return td;
    }

    function attachClickEvents() {
        document.querySelectorAll('.clickable-food').forEach(el => {
            el.removeEventListener('click', foodClickHandler);
            el.addEventListener('click', foodClickHandler);
        });
    }
    function foodClickHandler(e) {
        e.stopPropagation();
        const foodName = this.getAttribute('data-food');
        if(foodName && ingredientsData[foodName]) {
            openModal(foodName);
        }
    }

    const modal = document.getElementById('modalOverlay');
    const modalFoodName = document.getElementById('modalFoodName');
    const modalPersons = document.getElementById('modalPersons');
    const modalResult = document.getElementById('modalResult');
    function openModal(food) {
        modalFoodName.innerText = food;
        modalPersons.value = '';
        modalResult.innerHTML = '<div style="text-align:center; color:gray;">با وارد کردن تعداد نفرات، مواد را محاسبه کنید</div>';
        modal.classList.add('active');
        document.getElementById('modalCalcBtn').onclick = () => {
            let persons = parseInt(modalPersons.value);
            if(isNaN(persons) || persons < 1) {
                modalResult.innerHTML = '<div style="color:red;">تعداد نفرات معتبر وارد کنید</div>';
                return;
            }
            const ingredients = ingredientsData[food];
            let html = `<div style="font-weight:bold; margin-bottom:10px;">مواد لازم برای ${persons} نفر (${food}):</div>`;
            for(let [item, base] of Object.entries(ingredients)) {
                if(typeof base === 'number') {
                    let total = base * persons;
                    if(item.includes('تخم مرغ')) {
                        html += `<div class="result-item"><span>${item}</span><span>${Math.ceil(total)} عدد</span></div>`;
                    } else if(item.includes('کره حیوانی') || item === 'کره') {
                        let butterCount = Math.ceil(total / 10);
                        html += `<div class="result-item"><span>${item}</span><span>${total} گرم (${butterCount} عدد کره ۱۰ گرمی)</span></div>`;
                    } else if(total >= 1000) {
                        html += `<div class="result-item"><span>${item}</span><span>${total} گرم (${Math.round(total/1000)} کیلوگرم)</span></div>`;
                    } else {
                        html += `<div class="result-item"><span>${item}</span><span>${total} گرم</span></div>`;
                    }
                } else {
                    html += `<div class="result-item"><span>${item}</span><span>${base}</span></div>`;
                }
            }
            modalResult.innerHTML = html;
        };
    }
    document.getElementById('modalCloseBtn').onclick = () => modal.classList.remove('active');
    modal.onclick = (e) => { if(e.target === modal) modal.classList.remove('active'); };

    function resetDayChecklist(rowIndex) {
        ['breakfast','lunch','sideLunch','dinner','sideDinner'].forEach(meal => {
            delete checklistState[`row_${rowIndex}_${meal}`];
        });
        saveState();
        renderTable();
    }
    function resetAll() { checklistState = {}; saveState(); renderTable(); }

    let darkMode = localStorage.getItem('darkMode') === 'true';
    if(darkMode) document.body.classList.add('dark');
    document.getElementById('darkModeToggle').onclick = () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    };
    document.getElementById('printBtn').onclick = () => window.print();
    document.getElementById('resetAllChecklist').onclick = resetAll;
    document.addEventListener('click', (e) => {
        if(e.target.closest('.reset-day')) {
            let row = e.target.closest('.reset-day').getAttribute('data-row');
            if(row) resetDayChecklist(parseInt(row));
        }
    });
    renderTable();
</script>
</body>
</html>
